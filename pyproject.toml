[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trapsig"
version = "0.1.0"
description = "Leakage-safe, reproducible analysis of trapping/translocation time-series signals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED - to be decided by the project owner" }
authors = [{ name = "trapsig contributors" }]
keywords = ["signal-processing", "time-series", "reproducibility", "cross-validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    # Figures are on by default and are part of the required deliverables.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Model B (the 1D CNN) and the hybrid ensemble. Without these the pipeline still runs and
# reports Model A with an explicit note and the install command.
deep = [
    "torch>=2.0",
]
# TreeSHAP on the tree models and the PDF report. Both degrade to a recorded "not applicable"
# or "skipped" status when absent; nothing fails and no number is invented.
explain-report = [
    "shap>=0.44",
    "reportlab>=4.0",
]
full = [
    "torch>=2.0",
    "shap>=0.44",
    "reportlab>=4.0",
]

[project.scripts]
trapsig = "trapsig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:trapsig.*",
    # SciPy deprecation raised inside scikit-learn's L-BFGS call; not a trapsig issue.
    "ignore:.*options of the L-BFGS-B solver.*:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/trapsig"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true

# Third-party packages without bundled type stubs. Their results are treated as Any.
[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "yaml", "torch.*", "shap.*", "reportlab.*", "PIL.*", "matplotlib.*"]
ignore_missing_imports = true
