run:
  name: custom_dat
  seed: 42
data:
  source_dir: /data/dataset
  file_glob: '*.dat'
  dat:
    encoding: binary
    dtype: float32
    byteorder: little
    header_bytes: 0
    header_lines: 0
    n_columns: 1
    column: 0
    scale: 1.0
    units: raw
  label_level: file
  label_from: folder
  metadata_csv: null
  allow_file_level_fallback: true
  expected_duration_s: 20.0
  duration_tolerance_s: 0.01
sampling:
  original_hz: 1000000.0
  target_rates_hz:
  - 50000.0
  - 10000.0
  - 1000.0
  - 100.0
  - 10.0
  - 2.0
  rate_menu_hz:
  - 1000000.0
  - 50000.0
  - 25000.0
  - 10000.0
  - 1000.0
  - 100.0
  - 10.0
  - 2.0
  allow_off_menu_rates: true
segmentation:
  window_s: null
  overlap: 0.5
  stride_s: null
  normalize: robust
  detrend: none
  pad_mode: reflect
  max_windows_per_file: 64
quad:
  enabled: false
  embed_dim: 64
  use_temporal: true
  use_spectral: true
  use_engineered: true
  use_selfsup: true
  branch_ablation: []
  t_channels:
  - 16
  - 32
  - 64
  t_dilations:
  - 1
  - 4
  - 8
  t_kernel: 7
  t_transformer_layers: 1
  t_nhead: 4
  s_nfft: 256
  s_hop: 64
  s_channels:
  - 16
  - 32
  pretrain_epochs: 6
  pretrain_contrastive_weight: 1.0
  pretrain_recon_weight: 0.5
  pretrain_mask_fraction: 0.15
  pretrain_temperature: 0.1
  epochs: 12
  learning_rate: 0.003
  weight_decay: 0.01
  dropout: 0.1
  batch_size: 32
  warmup_epochs: 1
  focal_gamma: 0.0
  class_weight: none
  fusion_layers: 1
  fusion_nhead: 4
  select_metric: balanced_accuracy
  episodes: 40
  shots:
  - 1
  - 5
  queries_per_class: 3
  metric_temperature: 0.1
  supcon_weight: 0.2
  amp: false
  seed_offset: 4242
  feature_tiers:
  - 1
  - 2
  feature_families: []
  feature_select: variance
  triplet_weight: 0.0
  lr_schedule: none
  early_stopping_patience: 0
  open_set_msp_threshold: null
filters:
  mode: none
  lpf_cutoff_hz: null
  lpf_order: 4
  gaussian_sigma_s: null
  gaussian_truncate: 4.0
  notch_hz:
  - 50.0
  notch_q: 30.0
events:
  baseline_window_s: 0.1
  threshold_sigma: 5.0
  exit_sigma: 3.0
  min_duration_s: 0.001
  min_separation_s: 0.001
  pre_event_window_s: 0.02
  edge_guard_s: 0.01
splitting:
  n_splits: 5
  n_repeats: 5
  min_groups_per_class: 5
training:
  analysis_rate_hz: 10000.0
  psd_bands_hz:
  - - 1.0
    - 10.0
  - - 10.0
    - 100.0
  - - 100.0
    - 1000.0
  - - 1000.0
    - 5000.0
  - - 45.0
    - 55.0
  acf_lags_ms:
  - 0.1
  - 1.0
  - 10.0
  models:
  - logreg
  - rf
  - hgb
  lr_c_grid:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  inner_splits: 3
  rf_n_estimators: 500
  hgb_max_iter: 200
  n_permutations: 20
  bootstrap_resamples: 1000
  feature_groups:
  - all
  ablation: both
  ablation_model: logreg
  redundancy_threshold: 0.98
  save_models: true
  report_top_k: 0
  calibration_bins: 10
  pr_curves: true
  hpo: none
  hpo_metric: balanced_accuracy
  hpo_n_iter: 12
  hpo_seed_offset: 991
deep:
  enabled: true
  model_set: hybrid
  window_rate_hz: null
  window_ms: auto
  window_ms_auto_multiplier: 4.0
  window_ms_min: 10.0
  window_ms_max: 500.0
  pre_event_fraction: 0.25
  max_windows_per_file: 40
  aggregation: mean_proba
  channels: 32
  n_blocks: 3
  kernel_size: 5
  stem_stride: 4
  dropout: 0.2
  epochs: 40
  batch_size: 32
  learning_rate: 0.003
  weight_decay: 0.01
  warmup_epochs: 2
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0001
  select_metric: macro_f1
  gradient_clip: 1.0
  validation_fraction: 0.2
  n_permutations: 0
  temperature_scaling: true
  threads: 0
  metric_loss: supcon
  metric_loss_weight: 0.2
  metric_temperature: 0.1
  prototypical_head: true
  proto_distance: cosine
  hpo_trials: 0
  hpo_space_learning_rate:
  - 0.001
  - 0.003
  - 0.01
  hpo_space_dropout:
  - 0.1
  - 0.2
  - 0.3
  hpo_space_weight_decay:
  - 0.0
  - 0.01
  - 0.03
  fusion: both
  combine: equal_weight
  model_a_weight: 0.5
advanced:
  few_shot: false
  few_shot_k:
  - 1
  - 2
  - 5
  - 10
  few_shot_episodes: 200
  few_shot_distance: cosine
  semi_supervised: false
  pseudo_confidence_tau: 0.95
  pseudo_margin_delta: 0.2
  pseudo_rounds: 2
  novelty: false
  novelty_known_retention: 0.95
  clustering: false
  clustering_k:
  - 2
  - 3
  - 4
explain:
  enabled: true
  shap_features: true
  shap_background: 50
  grad_cam_1d: true
  integrated_gradients: true
  integrated_gradients_steps: 32
  occlusion: true
  occlusion_segments: 20
  shortcut_probes: true
  n_explained_windows: 20
report:
  plots: true
  pdf: true
  csv: true
  dpi: 150
  max_plots_per_class: 3
output:
  runs_dir: runs
